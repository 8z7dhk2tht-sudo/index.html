<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Мен билан боғланиш</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 0 0 30px;
      font-size: 25px;
      color: #222;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 17px;
      margin: 15px 0;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
    }

    .telegram {
      background: #229ED9;
    }

    .phone {
      background: #20b85a;
    }

    .icon {
      font-size: 25px;
    }

    .number {
      margin-top: 25px;
      color: #777;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Мен билан боғланиш</h1>

    <a
      class="button telegram"
      href="https://t.me/Boxo505"
    >
      <span class="icon">✈️</span>
      Telegram
    </a>

    <a
      class="button phone"
      href="tel:+998994884433"
    >
      <span class="icon">☎️</span>
      Телефон қилиш
    </a>

    <div class="number">
      +998 99 488 44 33
    </div>

  </div>

</body>
</html>
